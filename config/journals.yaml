# 期刊注册表：等级（参与评分加权、徽标、筛选）与影响因子（标注用）。
#
# ⚠ 影响因子为人工整理的近似 JCR 2023 值，仅作排序与参考，不保证精确；请以最新 JCR 为准。
#   修改此文件，或用 `reprohub journals import <csv>`（列：name,issn,if,tier,year）导入覆盖。
# 匹配顺序：ISSN → 别名精确匹配（大小写/标点不敏感；PubMed ISO 缩写、全名都写在 aliases）→ patterns 正则。
# 未命中的期刊：tier=unknown，不加分也不减分，IF 显示「未收录」；`reprohub journals unknown` 可列出高频未收录期刊。

meta:
  if_source: "近似 JCR 2023（人工整理，可能有偏差；可在 config/journals.yaml 修改或 CSV 导入）"
  if_year: 2023

tiers:
  cns:         { label: CNS,     boost: 12, rank: 0 }
  cns-sub:     { label: 大子刊,   boost: 8,  rank: 1 }
  general-top: { label: 综合顶刊, boost: 6,  rank: 2 }
  field-top:   { label: 领域顶刊, boost: 4,  rank: 3 }
  standard:    { label: "",      boost: 0,  rank: 4 }
  low-signal:  { label: "",      boost: -3, rank: 5 }   # 高发文量 OA 刊：不是不收，只是不因发表本身加分
  unknown:     { label: "",      boost: 0,  rank: 6 }

# 顶刊页 /top 与 feed/top.xml 收录的等级
top_tiers: [cns, cns-sub, general-top, field-top]

