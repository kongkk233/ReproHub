# 别名未命中时的正则（按顺序），只给等级不给 IF
patterns:
  - { match: "^(Nature|Nat) [A-Z]", tier: cns-sub }
  - { match: "^Lancet( |$)", tier: general-top }
  - { match: "^Cell [A-Z]", tier: cns-sub }
  - { match: "^(JAMA) [A-Z]", tier: general-top }
  - { match: "^Sci(ence)? (Adv|Transl|Immunol|Signal)", tier: cns-sub }
  - { match: "^(Front|Frontiers) ", tier: standard }
