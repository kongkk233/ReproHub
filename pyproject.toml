[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprohub"
version = "0.1.0"
description = "生殖医学 · 辅助生殖 · 胚胎多组学 — 文献聚合、解读、阅读管理与推送平台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "feedparser>=6.0",
  "python-multipart>=0.0.9",
  "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reprohub = "reprohub.cli:main"

[tool.setuptools.packages.find]
include = ["reprohub*"]

[tool.setuptools.package-data]
reprohub = ["schema.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
