{% extends "base.html" %}
{% block content %}
<h1>{{ collection.name }}</h1>
<p class="muted">{{ collection.description }} · {{ items|length }} 条 · <a href="/library?tab=collections">所有集合</a> · <a href="/api/v1/collections/{{ collection.id }}">JSON</a>
{% if owner %}<form method="post" action="/collections/{{ collection.id }}/delete" class="inline-form" onsubmit="return confirm('删除集合（不删除条目）？')"><button class="theme-toggle" type="submit">删除集合</button></form>{% endif %}</p>
{% for it in items %}{% include "_item.html" %}{% else %}<p class="muted">空集合。到条目页用「加入集合」添加。</p>{% endfor %}
{% endblock %}
